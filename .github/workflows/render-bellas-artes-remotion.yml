name: Render · Bellas Artes · Remotion

on:
  workflow_dispatch:
  push:
    branches:
      - remotion/bellas-artes-cover-cta
    paths:
      - 'remotion/bellas-artes-2026/**'
      - '.github/workflows/render-bellas-artes-remotion.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remotion/bellas-artes-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Download exact PACKERS MÉXICO V1.1 logo
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          rm -f public/pmx_logo_exact.svg
          gdown 'https://drive.google.com/uc?id=1oF6Fkw7f32j3DGd7ftpU_0uI7Bm50tLI' -O public/pmx_logo_exact.svg
          test -s public/pmx_logo_exact.svg
          grep -qi '<svg' public/pmx_logo_exact.svg
          echo "PMX exact SVG bytes: $(wc -c < public/pmx_logo_exact.svg)"

      - name: Verify required media
        run: |
          test -f public/jen_master.mp4 || (echo 'Missing public/jen_master.mp4' && exit 2)
          test -f public/colectivo_logo.webp || (echo 'Missing public/colectivo_logo.webp' && exit 2)
          test -f public/pmx_logo_exact.svg || (echo 'Missing exact PMX V1.1 SVG' && exit 2)

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Prepare clean higher-quality Jen source
        run: |
          # Source is 32.833 s. CapCut end-card begins around 31 s.
          # Trim to 30.75 s: all spoken copy is preserved (last locked subtitle ends at 29.164 s).
          ffmpeg -y -i public/jen_master.mp4 -t 30.75 \
            -vf "scale=1080:1920:flags=lanczos,eq=contrast=1.025:saturation=1.04:brightness=0.005,unsharp=5:5:0.28:5:5:0.0" \
            -c:v libx264 -preset slow -crf 15 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            public/jen_master_hq.mp4

      - name: Render Reel V6
        run: npm run render

      - name: Render Cover V6
        run: npm run still

      - name: Export QA frames
        run: |
          mkdir -p out/qa
          for t in 0.8 2.3 5.5 10.0 16.0 22.0 28.0 33.0 34.7; do
            ffmpeg -y -ss "$t" -i out/pmx-bellas-artes-reel.mp4 -frames:v 1 -q:v 2 "out/qa/frame-${t}s.jpg" >/dev/null 2>&1
          done

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMX-Bellas-Artes-Remotion-V6-FINAL-QA
          path: |
            remotion/bellas-artes-2026/out/pmx-bellas-artes-reel.mp4
            remotion/bellas-artes-2026/out/pmx-bellas-artes-cover.png
            remotion/bellas-artes-2026/out/qa/*.jpg
          if-no-files-found: error
          retention-days: 14
