name: Render · Bellas Artes · Remotion

on:
  workflow_dispatch:
  push:
    branches:
      - remotion/bellas-artes-2026
    paths:
      - 'remotion/bellas-artes-2026/**'
      - '.github/workflows/render-bellas-artes-remotion.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remotion/bellas-artes-2026

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify required media
        run: |
          test -f public/jen_master.mp4 || (echo 'Missing public/jen_master.mp4' && exit 2)
          test -f public/pmx_logo.webp || (echo 'Missing public/pmx_logo.webp' && exit 2)
          test -f public/colectivo_logo.webp || (echo 'Missing public/colectivo_logo.webp' && exit 2)

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare higher-quality Jen source
        run: |
          ffmpeg -y -i public/jen_master.mp4 \
            -vf "scale=1080:1920:flags=lanczos,eq=contrast=1.025:saturation=1.045:brightness=0.005,unsharp=5:5:0.30:5:5:0.0" \
            -c:v libx264 -preset slow -crf 15 -pix_fmt yuv420p \
            -c:a aac -b:a 192k \
            public/jen_master_hq.mp4

      - name: Render Reel
        run: npm run render

      - name: Render Cover
        run: npm run still

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: PMX-Bellas-Artes-Remotion-Render-V2
          path: |
            remotion/bellas-artes-2026/out/pmx-bellas-artes-reel.mp4
            remotion/bellas-artes-2026/out/pmx-bellas-artes-cover.png
          if-no-files-found: error
          retention-days: 14
